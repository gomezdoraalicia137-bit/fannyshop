<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72" role="img" aria-label="FannyShop">
  <defs>
    <linearGradient id="lkStroke" x1="10" y1="6" x2="62" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22e3ff" />
      <stop offset="0.45" stop-color="#2b6bff" />
      <stop offset="0.78" stop-color="#8b3dff" />
      <stop offset="1" stop-color="#ff3ea5" />
    </linearGradient>
    <linearGradient id="lkFill" x1="12" y1="10" x2="60" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#131734" />
      <stop offset="1" stop-color="#080a16" />
    </linearGradient>
    <linearGradient id="lkWord" x1="86" y1="20" x2="290" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22e3ff" />
      <stop offset="0.5" stop-color="#8b3dff" />
      <stop offset="1" stop-color="#ff3ea5" />
    </linearGradient>
    <filter id="lkGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(4 4)">
