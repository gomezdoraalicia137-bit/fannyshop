    <path d="M32 3.6 55.4 17v30L32 60.4 8.6 47V17z" fill="none" stroke="url(#lkStroke)" stroke-width="2.6" stroke-linejoin="round" filter="url(#lkGlow)" />
    <path d="M24.5 45V19h17v5.6H30.6v5.2h9.1v5.5h-9.1V45z" fill="#eaf3ff" />
    <path d="M43.4 33.6h5.4l-2.2 4.6 2.2 1.1-6.7 5.1 2-4.8-2.3-1z" fill="#22e3ff" />
  </g>

  <text x="80" y="46" font-family="Orbitron, 'Space Grotesk', system-ui, sans-serif" font-size="27" font-weight="700" letter-spacing="1.2" fill="#f2f5ff">FANNY</text>
  <text x="184" y="46" font-family="Orbitron, 'Space Grotesk', system-ui, sans-serif" font-size="27" font-weight="700" letter-spacing="1.2" fill="url(#lkWord)">SHOP</text>
  <text x="82" y="60" font-family="'Space Grotesk', system-ui, sans-serif" font-size="9" letter-spacing="4.4" fill="#9aa3c7">TARJETAS DIGITALES</text>
